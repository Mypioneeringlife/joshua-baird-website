name: Update live website content
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-live-content.mjs
      - name: Commit if content changed
        run: |
          git config user.name "website-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live-content.json data/live-content.js data/project-content.json data/project-content.js
          git diff --cached --quiet || git commit -m "Update live website content"
          git push
